<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست دانلود Base64</title>
</head>
<body>
    <h2>تست ذخیره فایل با Data URL 📥</h2>
    <button id="downloadBtn">تست دانلود فایل</button>

    <script>
        const downloadBtn = document.getElementById('downloadBtn');

        downloadBtn.onclick = function() {
            const textContent = "این یک فایل متنی آزماشی برای تست دانلود است.";
            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });

            // تبدیل فایل به Base64 Data URL
            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                
                // ساخت لینک دانلود با Base64
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = "test_file.txt";
                document.body.appendChild(a);
                a.click();
                a.remove();
            };
            reader.readAsDataURL(blob);
        };
    </script>
</body>
</html>
