<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست خروجی مینی‌اپ ایتا</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; padding: 20px; }
        textarea { width: 100%; margin-bottom: 10px; }
        button { padding: 10px 20px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <h2>تست اشتراک‌گذاری فایل</h2>
    <textarea id="myText" rows="5">سلام! این یک پاسخ تمرین است.</textarea>
    <br>
    <button id="downloadBtn">ارسال / ذخیره فایل 📤</button>

    <script>
        const downloadBtn = document.getElementById('downloadBtn');
        const myText = document.getElementById('myText');

        downloadBtn.onclick = async function() {
            const textContent = myText.value;
            
            // بررسی پشتیبانی سیستم از منوی اشتراک‌گذاری
            if (navigator.share) {
                try {
                    // تبدیل متن به یک فایل متنی
                    const file = new File([textContent], "tamrin.txt", { type: "text/plain" });
                    
                    // فراخوانی منوی اشتراک گوشی
                    await navigator.share({
                        title: 'فایل تمرین',
                        files: [file]
                    });
                } catch (error) {
                    alert("وضعیت: " + error.message);
                }
            } else {
                alert("مرورگر داخلی از قابلیت اشتراک‌گذاری پشتیبانی نمی‌کند.");
            }
        };
    </script>
</body>
</html>
